<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>keyboard fixture</title>
<style>
  body { margin: 20px; font: 18px sans-serif; }
  p { margin: 20px 0; }
  input, button { font: inherit; }
</style>
<button id="button" onclick="document.title='button activated'">Activate</button>
<label for="entry">Text</label><input id="entry" oninput="if(!location.search)document.title='input:'+this.value">
<input id="pw" type="password" value="secret">
<input id="ro" readonly value="fixed">
<fieldset id="fs"><legend><input id="lg" oninput="if(!location.search)document.title='legend:'+this.value"></legend>
<input id="off" value="kept" onblur="document.getElementById('fs').disabled=true"></fieldset>
<p id="first">alpha alphabet alpha</p>
<p id="second">alpha beta gamma</p>
<p id="browser">Browser Browser</p>
<script>
  if (new URLSearchParams(location.search).has("jump")) {
    document.title = "jump page";
  }
  if (new URLSearchParams(location.search).has("tab")) {
    document.getElementById("first").textContent = "Second tab: alpha alphabet alpha";
  }
  const title = new URLSearchParams(location.search).get("title");
  if (title) {
    document.title = title;
  }
  // The URL has no "z": only the later title matches "zbr".
  if (new URLSearchParams(location.search).has("retitle")) {
    document.title = "Quokka";
    setTimeout(() => { document.title = "Zebra"; }, 3000);
  }
  if (!location.search) {
    document.addEventListener("selectionchange", () => {
      const selection = getSelection();
      document.title = selection.toString()
        ? `m ${selection.anchorNode.parentElement.id}:${selection.anchorOffset}:${selection}`
        : "keyboard fixture";
    });
    let escapes = 0;
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") document.title = `escape ${++escapes}`;
    });
    document.addEventListener("focusin", event => {
      document.title = `focus ${event.target.id}${event.target.type === "password" || event.target.readOnly ? ":" + event.target.value : ""}${event.target.id === "lg" ? " off:" + document.getElementById("off").value : ""}`;
    });
  }
  for (let i = 0; i < 200; i++) {
    const p = document.createElement("p");
    p.textContent = `Row ${i}: browser keyboard performance fixture.`;
    document.body.append(p);
  }
</script>
</html>
