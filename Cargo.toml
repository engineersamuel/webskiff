[package]
name = "webskiff"
version = "0.8.0"
edition = "2021"
default-run = "webskiff"
autobins = false
description = "A keyboard-first Chromium browser for your terminal"
license = "MIT"
publish = false

[[bin]]
name = "webskiff"
path = "src/bin/zweb/main.rs"

[[bin]]
name = "zebkit-probe"
path = "src/main.rs"

[dependencies]
zebkit = "=0.4.0"
base64 = "0.23"
serde_json = "1"
crossterm = "0.29"
flate2 = "1"
libc = "0.2"
unicode-width = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
toml = "1.2"

[build-dependencies]
zebkit-build = "=0.4.0"
