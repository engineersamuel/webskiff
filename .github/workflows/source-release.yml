name: Source release and Homebrew

on:
  workflow_call:
    inputs:
      verify-only:
        type: boolean
        default: false
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HTTP_USER_AGENT: OpenAI File Downloader, XaiImageApiFetch/1.0
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.userAgent
  GIT_CONFIG_VALUE_0: OpenAI File Downloader, XaiImageApiFetch/1.0

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      tag: ${{ steps.draft.outputs.tag_name }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse to release a newer, untested branch head
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          actual="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$actual" = "$EXPECTED_COMMIT"
      - name: Authenticate release App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: engineersamuel
          repositories: |
            webskiff
            homebrew-tap
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Verify installation access without printing credentials
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api installation/repositories \
            -H "User-Agent: $CARGO_HTTP_USER_AGENT" \
            --jq '.repositories | map(.full_name) | sort' |
            jq -e '. == ["engineersamuel/homebrew-tap", "engineersamuel/webskiff"]'
      - name: Prepare the merged release as a draft
        id: draft
        if: ${{ !inputs.verify-only }}
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true
      - name: Prepare a SemVer release PR when no draft was created
        id: please
        if: ${{ inputs.verify-only || steps.draft.outputs.release_created != 'true' }}
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: ${{ github.ref_name }}
          skip-github-release: true
      - name: Merge the release PR after its required checks pass
        if: ${{ !inputs.verify-only && steps.draft.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$GITHUB_REF_NAME" \
            -H "User-Agent: $CARGO_HTTP_USER_AGENT" \
            --jq '.[] | select(any(.labels[]; .name == "autorelease: pending")) | .number' |
          while read -r number; do
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash
          done
      - name: Resolve the exact source to test
        id: candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERIFY_ONLY: ${{ inputs.verify-only }}
          RELEASE_CREATED: ${{ steps.draft.outputs.release_created }}
          PR_CREATED: ${{ steps.please.outputs.prs_created }}
          RELEASE_COMMIT: ${{ steps.draft.outputs.sha }}
          RELEASE_PR: ${{ steps.please.outputs.pr }}
        run: |
          if [ "$VERIFY_ONLY" = true ]; then
            number="$(printf '%s' "$RELEASE_PR" | jq -er .number)"
            commit="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
              -H "User-Agent: $CARGO_HTTP_USER_AGENT" --jq .head.sha)"
          elif [ "$RELEASE_CREATED" = true ]; then
            commit="$RELEASE_COMMIT"
          else
            if [ "$PR_CREATED" = true ]; then
              echo 'Release PR prepared; it merges when its required checks pass.'
            else
              echo 'No releasable commits; no PR or release was created.'
            fi
            exit 0
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  formula:
    needs: plan
    if: needs.plan.outputs.commit != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          version: "0.11.21"
          enable-cache: false
      - name: Confirm release tag matches the source version
        if: ${{ !inputs.verify-only }}
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: uv run --no-project python -I scripts/release.py check-tag "$RELEASE_TAG"
      - name: Generate the immutable source formula
        env:
          SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          uv run --no-project python -I scripts/release.py brew-source \
            --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_COMMIT" \
            --output candidate/webskiff.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-formula
          path: candidate/webskiff.rb
          if-no-files-found: error
          retention-days: 14

  homebrew:
    needs: [plan, formula]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          version: "0.11.21"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-formula
          path: candidate
      - name: Test actual source installation and upgrade on a fresh Mac
        env:
          SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          version="$(uv run --no-project python -I scripts/release.py version)"
          bash scripts/test-source-brew.sh "$PWD/candidate/webskiff.rb" "$SOURCE_COMMIT" "$version"

  publish:
    needs: [plan, homebrew]
    if: ${{ !inputs.verify-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate publisher for these two repositories only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: engineersamuel
          repositories: |
            webskiff
            homebrew-tap
          permission-contents: write
      - name: Check out tap with release-bot authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: engineersamuel/homebrew-tap
          ref: main
          token: ${{ steps.app.outputs.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-formula
          path: candidate
      - name: Promote only the exact tested formula
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cp candidate/webskiff.rb Formula/webskiff.rb
          if git diff --quiet -- Formula/webskiff.rb; then
            echo 'Tap already contains the tested formula.'
          else
            git config user.name 'Webskiff release bot'
            git config user.email 'webskiff-release-bot@users.noreply.github.com'
            git add Formula/webskiff.rb
            git commit -m "chore: release Webskiff $RELEASE_TAG"
            git push origin HEAD:main
          fi
      - name: Publish the source-only GitHub preview
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          release_id="$(gh api repos/engineersamuel/webskiff/releases --paginate --slurp \
            -H "User-Agent: $CARGO_HTTP_USER_AGENT" |
            jq -er --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] |
              if length == 1 then .[0].id else error("Expected one release for " + $tag) end')"
          gh api "repos/engineersamuel/webskiff/releases/$release_id" --method PATCH \
            -H "User-Agent: $CARGO_HTTP_USER_AGENT" -F draft=false -f make_latest=true \
            --jq .html_url
