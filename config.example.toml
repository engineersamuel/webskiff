# Copy to ~/.config/webskiff/config.toml. Missing entries keep these defaults.
# Each entry replaces all keys for that action in that mode. [] disables it.
# Keys: Ctrl-, Alt-, Shift-, Super-, named keys, or literal characters.
# Two-key sequences use a space ("g g") and are supported in browse mode.
# Remove a key from its old action before assigning it to another action.
# Global keys work in page input too, except while a website dialog is open.
# Prompt editing keys take priority over global keys. Global quit always works.
# Restart Webskiff after changing this file.

[keys.global]
quit = ["Ctrl-Q"]
find = ["Ctrl-F"]
open = ["Ctrl-L"]
new_tab = ["Ctrl-T"]
close_tab = ["Ctrl-W"]
next_tab = ["Ctrl-Tab"]
previous_tab = ["Ctrl-Shift-Tab"]
back = ["Alt-Left"]
forward = ["Alt-Right"]
reload = ["F5"]
help = ["F1"]
next_match = ["F3"]
previous_match = ["Shift-F3"]

[keys.browse]
scroll_down = ["j", "Down"]
scroll_up = ["k", "Up"]
scroll_left = ["h", "Left"]
scroll_right = ["l", "Right"]
half_down = ["d", "Ctrl-D"]
half_up = ["u", "Ctrl-U"]
page_down = ["Space", "PageDown"]
page_up = ["b", "PageUp"]
top = ["g g", "Home"]
bottom = ["G", "End"]
back = ["H"]
forward = ["L"]
reload = ["r"]
stop = ["s"]
next_tab = ["]", "K"]
previous_tab = ["[", "J"]
tab_1 = ["1"]
tab_2 = ["2"]
tab_3 = ["3"]
tab_4 = ["4"]
tab_5 = ["5"]
tab_6 = ["6"]
tab_7 = ["7"]
tab_8 = ["8"]
tab_9 = ["9"]
open = ["o"]
edit_address = ["O"]
new_tab = ["t"]
close_tab = ["x"]
find = ["/"]
next_match = ["n"]
previous_match = ["N"]
insert = ["i"]
focus_input = ["g i"]
hints = ["f"]
hints_new_tab = ["F"]
copy_url = ["y"]
toggle_images = ["I"]
zoom_in = ["+", "="]
zoom_out = ["-"]
zoom_reset = ["0"]
help = ["?"]
quit = ["Ctrl-C"]
quit_hint = ["q"]
focus_next = ["Tab"]
focus_previous = ["Shift-Tab"]
activate = ["Enter"]
page_escape = ["Esc"]

[keys.insert]
cancel = ["Esc"]

[keys.prompt]
accept = ["Enter"]
cancel = ["Esc"]
previous_match = ["Shift-Enter"]
cursor_left = ["Left"]
cursor_right = ["Right"]
cursor_home = ["Home"]
cursor_end = ["End"]
backspace = ["Backspace"]
delete = ["Delete"]
clear = ["Ctrl-U"]
delete_word = ["Ctrl-W"]

[keys.hint]
cancel = ["Esc"]
backspace = ["Backspace"]

[keys.help]
cancel = ["Esc", "q", "F1", "?"]
scroll_down = ["j", "Down"]
scroll_up = ["k", "Up"]
page_down = ["Space", "PageDown"]
page_up = ["b", "PageUp"]
top = ["g", "Home"]
bottom = ["G", "End"]
